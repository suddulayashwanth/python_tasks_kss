<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>Student Management System</h1>


    <!-- ========================= -->
    <!-- STUDENT FORM -->
    <!-- ========================= -->

    <div class="form-container">

        <h2 id="formTitle">
            Add Student
        </h2>


        <form id="studentForm">

            <input
                type="hidden"
                id="studentId"
            >


            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>Course</label>

                <input
                    type="text"
                    id="course"
                    placeholder="Enter course"
                    required
                >

            </div>


            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    id="department"
                    placeholder="Enter department"
                    required
                >

            </div>


            <div class="form-group">

                <label>Year</label>

                <select id="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                    <option value="3rd Year">
                        3rd Year
                    </option>

                    <option value="4th Year">
                        4th Year
                    </option>

                </select>

            </div>


            <button
                type="submit"
                id="submitButton"
            >
                Add Student
            </button>


            <button
                type="button"
                id="cancelButton"
                onclick="cancelEdit()"
                style="display:none;"
            >
                Cancel
            </button>

        </form>

    </div>


    <!-- ========================= -->
    <!-- SEARCH -->
    <!-- ========================= -->

    <div class="search-container">

        <input
            type="text"
            id="search"
            placeholder="Search students..."
            onkeyup="searchStudents()"
        >

    </div>


    <!-- ========================= -->
    <!-- STUDENT TABLE -->
    <!-- ========================= -->

    <div class="table-container">

        <h2>Student List</h2>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Phone</th>

                    <th>Course</th>

                    <th>Department</th>

                    <th>Year</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>

</div>


<script>


// ==========================================
// MONGODB API SERVER
// ==========================================

const API_URL =
    "http://127.0.0.1:5000/api/students";


// ==========================================
// LOAD STUDENTS
// ==========================================

async function loadStudents() {

    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to load students"
            );

        }


        const students =
            await response.json();


        displayStudents(students);

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to connect to Flask server."
        );

    }

}


// ==========================================
// DISPLAY STUDENTS
// ==========================================

function displayStudents(students) {

    const tableBody =
        document.getElementById(
            "studentTableBody"
        );


    tableBody.innerHTML = "";


    if (students.length === 0) {

        tableBody.innerHTML = `

            <tr>

                <td colspan="8">
                    No students found
                </td>

            </tr>

        `;

        return;

    }


    students.forEach(student => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${student.id}</td>

            <td>${student.name}</td>

            <td>${student.email}</td>

            <td>${student.phone}</td>

            <td>${student.course}</td>

            <td>${student.department}</td>

            <td>${student.year}</td>

            <td>

                <button
                    class="edit-btn"
                    onclick='editStudent(${JSON.stringify(student)})'
                >
                    Edit
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteStudent('${student.id}')"
                >
                    Delete
                </button>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


// ==========================================
// ADD / UPDATE STUDENT
// ==========================================

document
    .getElementById("studentForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const studentId =
                document.getElementById(
                    "studentId"
                ).value;


            const studentData = {

                name:
                    document.getElementById(
                        "name"
                    ).value,

                email:
                    document.getElementById(
                        "email"
                    ).value,

                phone:
                    document.getElementById(
                        "phone"
                    ).value,

                course:
                    document.getElementById(
                        "course"
                    ).value,

                department:
                    document.getElementById(
                        "department"
                    ).value,

                year:
                    document.getElementById(
                        "year"
                    ).value

            };


            try {

                let response;


                // UPDATE

                if (studentId) {

                    response =
                        await fetch(
                            `${API_URL}/${studentId}`,
                            {

                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        studentData
                                    )

                            }
                        );

                }


                // ADD

                else {

                    response =
                        await fetch(
                            API_URL,
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        studentData
                                    )

                            }
                        );

                }


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Operation failed"
                    );

                }


                if (studentId) {

                    alert(
                        "Student updated successfully!"
                    );

                }

                else {

                    alert(
                        "Student added successfully!"
                    );

                }


                resetForm();

                loadStudents();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Error: " +
                    error.message
                );

            }

        }
    );


// ==========================================
// EDIT STUDENT
// ==========================================

function editStudent(student) {

    document.getElementById(
        "studentId"
    ).value = student.id;


    document.getElementById(
        "name"
    ).value = student.name;


    document.getElementById(
        "email"
    ).value = student.email;


    document.getElementById(
        "phone"
    ).value = student.phone;


    document.getElementById(
        "course"
    ).value = student.course;


    document.getElementById(
        "department"
    ).value = student.department;


    document.getElementById(
        "year"
    ).value = student.year;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Student";


    document.getElementById(
        "submitButton"
    ).textContent =
        "Update Student";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "inline-block";

}


// ==========================================
// DELETE STUDENT
// ==========================================

async function deleteStudent(id) {

    if (
        !confirm(
            "Are you sure you want to delete this student?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Delete failed"
            );

        }


        alert(
            "Student deleted successfully!"
        );


        loadStudents();

    }

    catch (error) {

        console.error(error);

        alert(
            "Error: " +
            error.message
        );

    }

}


// ==========================================
// SEARCH
// ==========================================

async function searchStudents() {

    const searchValue =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    try {

        const response =
            await fetch(API_URL);


        const students =
            await response.json();


        const filteredStudents =
            students.filter(student =>

                String(student.id)
                    .toLowerCase()
                    .includes(searchValue) ||

                student.name
                    .toLowerCase()
                    .includes(searchValue) ||

                student.email
                    .toLowerCase()
                    .includes(searchValue) ||

                student.phone
                    .toLowerCase()
                    .includes(searchValue) ||

                student.course
                    .toLowerCase()
                    .includes(searchValue) ||

                student.department
                    .toLowerCase()
                    .includes(searchValue) ||

                student.year
                    .toLowerCase()
                    .includes(searchValue)

            );


        displayStudents(
            filteredStudents
        );

    }

    catch (error) {

        console.error(error);

    }

}


// ==========================================
// RESET FORM
// ==========================================

function resetForm() {

    document
        .getElementById("studentForm")
        .reset();


    document.getElementById(
        "studentId"
    ).value = "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add Student";


    document.getElementById(
        "submitButton"
    ).textContent =
        "Add Student";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


// ==========================================
// CANCEL EDIT
// ==========================================

function cancelEdit() {

    resetForm();

}


// ==========================================
// LOAD DATA
// ==========================================

loadStudents();

</script>

</body>

</html>
